[workspace]
resolver = "2"
members = ["crates/aikido-core", "crates/aikido-cli", "crates/aikido-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MortenHusted"]

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls",
    "webpki-roots",
    "json",
    "query",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tempfile = "3"
wiremock = "0.6"
