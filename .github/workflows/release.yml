name: Release

# Builds `aikido` and `aikido-mcp` for every supported platform on a `v*`
# tag and attaches the archives to the GitHub release. Each target builds on
# a native runner for its OS, so no cross toolchain, sysroot, or NASM is
# involved: the crypto provider is ring (plain `cc`), and the keychain
# backend only compiles on macOS. The Linux binaries are static musl so one
# archive runs on any distribution and in scratch containers.
#
# Verify a download before trusting it: every archive has a line in
# SHA256SUMS, published alongside.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest,   target: aarch64-apple-darwin }
          - { os: macos-13,       target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl linker
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --workspace --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="aikido-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp README.md LICENSE* "dist/${name}/" 2>/dev/null || cp README.md "dist/${name}/"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/aikido.exe" "target/${{ matrix.target }}/release/aikido-mcp.exe" "dist/${name}/"
            (cd dist && 7z a -tzip "${name}.zip" "${name}" >/dev/null)
          else
            cp "target/${{ matrix.target }}/release/aikido" "target/${{ matrix.target }}/release/aikido-mcp" "dist/${name}/"
            (cd dist && tar czf "${name}.tar.gz" "${name}")
          fi
          rm -rf "dist/${name}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          generate_release_notes: true
