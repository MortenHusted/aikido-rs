[package]
name = "aikido-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Shared client for the Aikido Security public API: auth, token store, endpoints. Unofficial."

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
base64 = "0.22"
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest.workspace = true
# reqwest's `rustls` feature selects aws-lc-rs, whose C build needs cmake and
# a per-target toolchain (NASM on Windows, a cross sysroot for musl/aarch64);
# `cargo check --target` from a Mac fails in its build script. ring builds
# with plain `cc` everywhere this CLI ships, so it is the one crypto
# provider enabled and rustls therefore installs it as the process default.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio = { version = "1", features = ["time"] }
chrono.workspace = true
dirs.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
wiremock.workspace = true

# macOS only: Linux would need the D-Bus secret-service stack, and Windows
# Credential Manager cannot hold the credential blob (see credentials.rs).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
