# codemap-slop budget for aikido-rs: what one change may do, and the shape
# the crates are held to. Adapted from codemap's own Rust budget (its
# ceilings were seeded from a measured snapshot on 2026-09-16 under
# cc-sloc-clones-form/rust/1), so the numbers describe a Rust shape this
# repository is held to, not a truth about Rust.
#
# The gate breaches only on what a change added or made worse
# (target-ratchet); everything already over a ceiling prints as the
# backlog. The slop-review helper runs the gate on every review while this
# file is present.

# advisory limits per change
max_new_high_cc_callables = 0
max_erosion_delta = 0.005
max_loc_delta = 2000

# test code, kept out of the figures (the all-files line still prints)
exclude = "crates/aikido-core/tests/"
exclude = "crates/aikido-cli/tests/"
exclude = "crates/aikido-mcp/tests/"

[target.callable_cc]         # the erosion cutoff
prefix = "crates/"
measure = "cc"
stat = "each"
max = 10

[target.callable_sloc_p90]
prefix = "crates/"
measure = "sloc"
stat = "p90"
max = 41

[target.params]              # Sandi Metz's rule 3
prefix = "crates/"
measure = "params"
stat = "each"
max = 4

[target.nesting]             # Sonar's default ceiling
prefix = "crates/"
measure = "nesting"
stat = "each"
max = 3

[target.chain_p90]           # message chains
prefix = "crates/"
measure = "chain"
stat = "p90"
max = 4
